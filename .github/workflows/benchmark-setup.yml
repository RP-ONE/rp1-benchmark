name: Benchmark setup

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.x'
          cache: true
      - name: Client, account, and setup failure checks
        env:
          RP1_BENCHMARK_E2E_ARTIFACT_DIR: ${{ runner.temp }}/rp1-client-fixtures
        run: |
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Published binary and four-validator benchmark
        run: |
          python3 scripts/benchmark.py private --concurrency 4 --operations-per-envelope 10 --duration 10s
          cp .rp1-benchmark/private/result.json .rp1-benchmark/private/initial-result.json
          cp .rp1-benchmark/private/setup.json .rp1-benchmark/private/initial-setup.json
          python3 scripts/benchmark.py private --concurrency 4 --operations-per-envelope 10 --duration 10s
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.rp1-benchmark/private')
          for prefix in ('initial-', ''):
              setup = json.loads((root / (prefix + 'setup.json')).read_text())
              result = json.loads((root / (prefix + 'result.json')).read_text())
              assert setup['complete'] and len(setup['validators']) == 4
              assert len(setup['terminal_validators']) == 4
              assert len({json.dumps(node['header'], sort_keys=True) for node in setup['terminal_validators']}) == 1
              assert not result.get('run_error') and result['workers_stopped']
              assert result['successful_envelopes'] >= 20
              assert result['signed_envelopes'] == result['successful_envelopes']
          initial = json.loads((root / 'initial-setup.json').read_text())
          previous_height = int(initial['terminal_validators'][0]['header']['header']['height'])
          assert all(int(node['header']['header']['height']) > previous_height for node in setup['validators'])
          PY
      - name: Exact 6,137-output workload on a fresh private network
        run: |
          python3 scripts/benchmark.py private --profile legacy-6137
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path('.rp1-benchmark/legacy-6137')
          setup = json.loads((root / 'setup.json').read_text())
          result = json.loads((root / 'result.json').read_text())
          assert setup['complete'] and len(setup['validators']) == 4
          assert len(setup['terminal_validators']) == 4
          assert len({json.dumps(node['header'], sort_keys=True) for node in setup['terminal_validators']}) == 1
          assert not result.get('run_error') and result['workers_stopped']
          assert result['requested_envelopes'] == result['successful_envelopes'] == result['signed_envelopes'] == 100
          assert result['operations_per_envelope'] == 6137 and result['committed_operations'] == 613700
          PYTHON
      - name: Retain public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-setup-evidence
          path: |
            .rp1-benchmark/private/setup.json
            .rp1-benchmark/private/result.json
            .rp1-benchmark/private/validators.log
            .rp1-benchmark/private/initial-setup.json
            .rp1-benchmark/private/initial-result.json
            .rp1-benchmark/legacy-6137/setup.json
            .rp1-benchmark/legacy-6137/result.json
            .rp1-benchmark/legacy-6137/validators.log
          include-hidden-files: true
          if-no-files-found: warn
